# Application Configuration
# Phase 1 – No database. Stub auth endpoints only.

server.port=8080

# Application name
spring.application.name=campusconnect-backend

# ── Disable JPA auto-config (no DB in Phase 1) ──────────────
# TODO (Phase 2): Remove these two lines and configure datasource
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# ── Logging ──────────────────────────────────────────────────
logging.level.com.campusconnect=DEBUG
logging.level.org.springframework.security=INFO
