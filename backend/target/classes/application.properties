# ============================================================
# CampusConnect – Root Application Properties
# Active profile selector.
# Switch to 'prod' before deploying to production.
# ============================================================

spring.application.name=campusconnect-backend

# Set active profile: dev (H2 in-memory) | prod (MySQL)
spring.profiles.active=prod

# Server port
server.port=8080

# Global Jackson settings
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=non_null

# JWT Security Settings
jwt.secret=${JWT_SECRET:c29tZS1zZWNyZXQta2V5LWZvci1jYW1wdXNjb25uZWN0LWF1dGgtcGhhc2UtMi1tdXN0LWJlLWF0LWxlYXN0LTI1Ni1iaXRzLWxvbmc=}
jwt.expiry-ms=86400000
