# ============================================================
# CampusConnect – PROD Profile (Neon PostgreSQL)
# Neon DB credentials are managed via environment variables.
# NEVER commit real credentials to Git — use environment variables.
# ============================================================

# ── Neon PostgreSQL Database ────────────────────────────────
# Set the following environment variables in production:
#   DATABASE_URL  (full Neon connection string including sslmode=require)
#
# The JDBC URL is derived from DATABASE_URL at runtime.
# Neon requires sslmode=require and channel_binding=require.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# ── JPA / Hibernate ────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# 'validate' in production — Flyway/Liquibase would run migrations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ── SQL Seed Data (runs data.sql on first deploy, skipped if data already exists) ─
# Set to 'never' to prevent wiping custom admin sections
spring.sql.init.mode=never
spring.sql.init.data-locations=classpath:data.sql
spring.jpa.defer-datasource-initialization=true

# ── H2 Console DISABLED in production ──────────────────────
spring.h2.console.enabled=false

# ── Logging ────────────────────────────────────────────────
logging.level.com.campusconnect=INFO
logging.level.org.springframework.security=WARN

# ── Stripe ─────────────────────────────────────────────────
# Set STRIPE_SECRET_KEY in backend/.env (never commit the real value)
stripe.secret.key=${STRIPE_SECRET_KEY}

# ── JWT ───────────────────────────────────────
# Base64-encoded HMAC-SHA256 signing secret — read from JWT_SECRET env var or fallback default
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

# Token lifetime in milliseconds (default 24 hours)
jwt.expiry-ms=${JWT_EXPIRY_MS:86400000}
