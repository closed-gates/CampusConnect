# ============================================================
# CampusConnect – Root Application Properties
# Active profile selector.
# Switch to 'prod' before deploying to production.
# ============================================================

spring.application.name=campusconnect-backend

# Load local deployment credentials when present. This file is git-ignored and
# optional; hosted environments can continue to provide environment variables.
spring.config.import=optional:file:.env[.properties]

# Set active profile: dev (H2 in-memory) | prod (MySQL)
spring.profiles.active=prod

# Server port (Render dynamically sets PORT env var)
server.port=${PORT:8080}

# Profile pictures allow up to 2 MB; request limit includes multipart metadata.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# Global Jackson settings
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=non_null

# JWT (required on every profile; prod may override via JWT_SECRET)
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiry-ms=${JWT_EXPIRY_MS:86400000}
