# ============================================================
# CampusConnect – PROD Profile (Neon PostgreSQL)
# Neon DB credentials are managed via environment variables.
# NEVER commit real credentials to Git — use environment variables.
# ============================================================

# ── Neon PostgreSQL Database ────────────────────────────────
# Set the following environment variables in production:
#   DATABASE_URL  (full Neon connection string including sslmode=require)
#
# The JDBC URL is derived from DATABASE_URL at runtime.
# Neon requires sslmode=require and channel_binding=require.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-plain-sky-azj97mzc.c-3.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neondb_owner}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# ── JPA / Hibernate ────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# 'validate' in production — Flyway/Liquibase would run migrations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ── SQL Seed Data (runs data.sql on first deploy, skipped if data already exists) ─
# Set to 'never' after first run if you manage data manually via Neon console.
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql
spring.jpa.defer-datasource-initialization=true

# ── H2 Console DISABLED in production ──────────────────────
spring.h2.console.enabled=false

# ── Logging ────────────────────────────────────────────────
logging.level.com.campusconnect=INFO
logging.level.org.springframework.security=WARN
