# ============================================================
# CampusConnect – PROD Profile (MySQL)
# Fill in your MySQL credentials before deploying to production.
# NEVER commit real credentials to Git — use environment variables.
# ============================================================

# ── MySQL Database ─────────────────────────────────────────
# Use environment variables in production:
#   SPRING_DATASOURCE_URL
#   SPRING_DATASOURCE_USERNAME
#   SPRING_DATASOURCE_PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/campusconnect?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# ── JPA / Hibernate ────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# 'validate' in production — Flyway/Liquibase would run migrations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ── H2 Console DISABLED in production ──────────────────────
spring.h2.console.enabled=false

# ── Logging ────────────────────────────────────────────────
logging.level.com.campusconnect=INFO
logging.level.org.springframework.security=WARN
